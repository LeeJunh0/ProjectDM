<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>성장 스킬 아이콘 자연스러운 빛 비교</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#15111e;color:#eee3d1;font:15px/1.5 system-ui,sans-serif;padding:30px}main{max-width:1150px;margin:auto}h1{font-size:25px;color:#ecd18f;margin:0}p{color:#bdb1c5}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:#251e31;border:1px solid #5b4931;padding:15px;text-align:center}.pair{display:flex;justify-content:center;gap:14px}.item{width:140px;min-width:0}.icon{position:relative;width:125px;height:125px;max-width:100%;margin:auto}.art{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background-repeat:no-repeat;image-rendering:pixelated}.label{color:#aaa0b3;font-size:12px}.name{margin:8px 0 0;font-weight:bold}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style></head><body><main><h1>성장 스킬 아이콘 · 빛과 입자 시안</h1><p>왼쪽은 이전 여백 시안, 오른쪽은 굵기와 빛의 강약, 불규칙한 입자를 시도한 새 시안이야. 게임에는 적용하지 않았어.</p><div id="grid" class="grid"></div></main>
<script>
const names=['마력탄','마력 광선','마력 위성','화염 분사','화염 지대','화염 운석','연쇄 번개','뇌전 구체','낙뢰','얼음 공전','눈보라','빙결 파쇄'];
const root='../../../Assets/Resources/ProjectDM/UI/GrowthIcons/';
const xs=[0,410,840,1230],ys=[0,318,646,958,1278];
function icon(i,sparse){if(i===7)return `<span class="art" style="width:110px;height:110px;background-image:url('${sparse?'orb-organic.png':'../NegativeSpacePreview/orb-negative-space.png'}');background-size:contain;background-position:center"></span>`;let col=i%3,row=Math.floor(i/3),cw=xs[col+1]-xs[col],starts=sparse?[0,342,680,988]:ys,ends=sparse?[330,658,965,1278]:ys.slice(1),top=starts[row],ch=ends[row]-top,aspect=cw/ch,w=aspect>=1?110:110*aspect,h=aspect>=1?110/aspect:110;return `<span class="art" style="width:${w}px;height:${h}px;background-image:url('${sparse?'skill-organic.png':'../NegativeSpacePreview/skill-negative-space.png'}');background-size:${1230/cw*100}% ${1278/ch*100}%;background-position:${xs[col]/(1230-cw)*100}% ${top/(1278-ch)*100}%"></span>`}
document.getElementById('grid').innerHTML=names.map((name,i)=>`<article class="card"><div class="pair"><div class="item"><div class="icon">${icon(i,false)}</div><div class="label">이전 여백 시안</div></div><div class="item"><div class="icon">${icon(i,true)}</div><div class="label">빛·입자 시안</div></div></div><div class="name">${name}</div></article>`).join('');
</script></body></html>
