<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스킬 아이콘 외곽선 비교</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#15111e;color:#eee3d1;font:15px/1.5 system-ui,sans-serif;padding:30px}main{max-width:1100px;margin:auto}h1{font-size:25px;color:#ecd18f;margin:0}p{color:#bdb1c5}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:#251e31;border:1px solid #5b4931;padding:13px;text-align:center}.pair{display:flex;justify-content:center;gap:16px}.item{width:100px}.icon{position:relative;width:90px;height:90px;margin:auto}.art{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background-repeat:no-repeat;image-rendering:pixelated}.label{color:#aaa0b3;font-size:12px}.name{margin:8px 0 0;font-weight:bold}@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:420px){.grid{grid-template-columns:1fr}}
</style></head><body><main><h1>스킬 아이콘 외곽선 비교</h1><p>왼쪽은 현재 게임에 쓰는 아이콘, 오른쪽은 외곽선을 얇고 연하게 수정한 시안이야. 게임에는 아직 적용하지 않았어.</p><div id="grid" class="grid"></div></main>
<script>
const names=['마력탄','마력 광선','마력 위성','화염 분사','화염 지대','화염 운석','연쇄 번개','뇌전 구체','낙뢰','얼음 공전','눈보라','빙결 파쇄'];
const root='../../../Assets/Resources/ProjectDM/UI/GrowthIcons/';
const xs=[0,410,840,1230],ys=[0,318,646,958,1278];
function icon(i,soft){if(i===7)return `<span class="art" style="width:76px;height:76px;background-image:url('${soft?'orb-outline-soft.png':root+'MatchedLightningOrb_v2.png'}');background-size:contain;background-position:center"></span>`;let col=i%3,row=Math.floor(i/3),cw=xs[col+1]-xs[col],ch=ys[row+1]-ys[row],aspect=cw/ch,w=aspect>=1?76:76*aspect,h=aspect>=1?76/aspect:76;return `<span class="art" style="width:${w}px;height:${h}px;background-image:url('${soft?'skill-outline-soft.png':root+'MatchedSkills_v2.png'}');background-size:${1230/cw*100}% ${1278/ch*100}%;background-position:${xs[col]/(1230-cw)*100}% ${ys[row]/(1278-ch)*100}%"></span>`}
document.getElementById('grid').innerHTML=names.map((name,i)=>`<article class="card"><div class="pair"><div class="item"><div class="icon">${icon(i,false)}</div><div class="label">현재</div></div><div class="item"><div class="icon">${icon(i,true)}</div><div class="label">수정 시안</div></div></div><div class="name">${name}</div></article>`).join('');
</script></body></html>
