<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>석재 던전 · 바닥과 환경 비교</title>
<style>body{margin:0;background:#141824;color:#e5e9f3;font:15px/1.6 system-ui,sans-serif}main{max-width:1800px;margin:auto;padding:28px}h1{font-size:24px;margin:0 0 5px}p{color:#aeb7cd;margin:0 0 24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}article{background:#1d2332;border:1px solid #343d53;border-radius:8px;overflow:hidden}article h2{font-size:17px;padding:12px 16px 0;margin:0}article p{padding:0 16px;margin:3px 0 12px}img{width:100%;display:block;cursor:zoom-in}dialog{border:1px solid #65718e;padding:6px;background:#141824;max-width:96vw;max-height:95vh}dialog::backdrop{background:#000c}dialog img{width:auto;max-width:94vw;max-height:90vh;object-fit:contain;cursor:zoom-out}button{background:#303b55;border:1px solid #647498;color:white;padding:7px 15px;cursor:pointer;float:right}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style>
<main><h1>석재 던전 · 바닥과 환경 조화</h1><p>C안 적용 완료 · <a style="color:#b6caff" href="AppliedC/unity-render.png">실제 Unity 적용 렌더 보기</a> · 아래 비교 시안은 생성 이미지이므로 실제 게임과 작은 차이가 있습니다.</p><div class="grid">
<article><h2>현재 화면</h2><p>청보라 바닥 + 밝은 회색 잔해</p><img src="original.png" alt="현재 게임 화면"></article>
<article><h2>A · 환경물 기준으로 바닥 조정</h2><p>회색 기둥·잔해 유지 / 바닥을 중성 청회색으로</p><img src="A-floor-to-props.png" alt="A 바닥 조정"></article>
<article><h2>B · 바닥 기준으로 환경물 조정</h2><p>청보라 바닥 유지 / 환경물의 밝기·채도·질감 정리</p><img src="B-props-to-floor.png" alt="B 환경물 조정"></article>
<article><h2>C · 양쪽 함께 조정</h2><p>공통 청회색 팔레트 / 명암과 도트 표현을 함께 맞춤</p><img src="C-both-balanced.png" alt="C 양쪽 조정"></article>
</div></main><dialog id="preview"><button type="button" onclick="document.querySelector('dialog').close()">닫기</button><img id="large" alt="확대 비교 시안"></dialog><script>const preview=document.getElementById('preview'),large=document.getElementById('large');document.querySelectorAll('article img').forEach(img=>img.onclick=()=>{large.src=img.src;large.alt=img.alt;preview.showModal()});large.onclick=()=>preview.close();</script></html>
