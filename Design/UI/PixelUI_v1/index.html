<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel UI · 리소스 후보 v1</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:32px;background:#14111c;color:#eee5d2;font:15px/1.6 system-ui,sans-serif}h1{margin:0;font-size:25px;color:#efd38f}p{color:#a99fb7;margin:8px 0 24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px;max-width:1500px}.card{border:1px solid #544530;background:#211b2b;padding:14px}.preview{height:250px;display:flex;align-items:center;justify-content:center;background-color:#292531;background-image:linear-gradient(45deg,#35303d 25%,transparent 25%),linear-gradient(-45deg,#35303d 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#35303d 75%),linear-gradient(-45deg,transparent 75%,#35303d 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.preview img{max-width:96%;max-height:235px;object-fit:contain;image-rendering:pixelated}a{color:#efd38f;text-decoration:none}.name{margin-top:10px;font-weight:650}.file{font-size:12px;color:#aca1b7}
</style>
<h1>Pixel UI · 리소스 후보 v1</h1><p>투명 PNG 원본 12종 · 글자·아이콘 별도 · 실제 게임 연결 · 이미지를 누르면 원본을 엽니다.</p><main class="grid" id="grid"></main>
<script>
const items=[['panel_result','결과창 패널'],['panel_tooltip','정보·툴팁 패널'],['button_primary','주요 동작 버튼'],['button_secondary','보조 동작 버튼'],['card_bronze','동 등급 카드'],['card_silver','은 등급 카드'],['card_gold','금 등급 카드'],['mana_frame','마나 게이지 프레임'],['growth_node','성장노드 바탕'],['tab','선택 탭'],['currency_badge','재화 표시 바탕'],['divider','구분선']];
document.getElementById('grid').innerHTML=items.map(([id,name])=>{const src=`${id}.png${id.startsWith('card_')?'?v=no-grade-tab-1':''}`;return `<article class="card"><a class="preview" href="${src}"><img src="${src}" alt="${name}"></a><div class="name">${name}</div><div class="file">${id}.png</div></article>`}).join('');
</script></html>
